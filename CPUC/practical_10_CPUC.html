<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <style>
        body,html{
            width:100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            font-size: 3rem;
            color: red;
            font-style: italic;
            text-align: center;
            text-decoration: underline;
        }
        .container{
            width: 100%;
            height: auto;
            padding: 10px;
            border:4px dotted greenyellow;
        }
        p{
            font-size: x-large;
        }
        ul{
            font-size: x-large;
            padding-left: 25px ;
        }
        .code{
            width: 100%;
            height: auto;
            background-color: aliceblue;
            position: relative;
                overflow: auto;
            font-style: normal;
            font-size: large;
            border-radius: 2.5%;
        }
        #copyBtn{
            color:black;
            position: absolute;
            cursor: pointer;
            padding: 5px 10px;
            border:none;
            top:10px;
            right:10px;
        }
        
        /* media to responsive mobile  */
        @media (max-width:768px){
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body,html{
                width: 100%;
                height: auto;
            }
            .container{
                width: 100%;
                height: auto;
            }
            h1{
            font-size: 1rem;
            }
            P{
                font-size: large;
            }
            span{
                font-size: larger;
            }
            pre,code{
                width: 100%;
                overflow: auto;
            position: relative;
            }

        }
</style>
</head>
<body>
<div class="container">
        <h1>Practical No.-6</h1>
        <p>
         <div class="code"><button id="copyBtn" onclick="copycode()"><i class="fa-solid fa-copy"> copy-code</i></button>
        <pre id="program">
            <code class="language-c">
    <span style="font-weight: 700;font-size: xx-large;">C</span>  


</pre>   
</div>



</p>
</div>

<script type="module">
 import { copycode } from './function.js';

 document.getElementById("copyBtn").addEventListener("click",copycode);

</script>
</body>
</html>
